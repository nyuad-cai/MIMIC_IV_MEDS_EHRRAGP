hosp/labevents:
  lab:
    code:
      - LAB
      - col(itemid)
      # - col(valueuom)
      - hosp/labevents
    hadm_id: hadm_id
    time: col(charttime)
    time_format: "%Y-%m-%d %H:%M:%S"
    numeric_value: valuenum
    text_value: value
    priority: priority
    specimen_id: specimen_id
    lab_lower_limit: ref_range_lower
    lab_upper_limit: ref_range_upper
    lab_flag: flag
    lab_unit: valueuom
    lab_itemid: itemid
    _metadata:
      d_labitems_to_loinc:
        description: ["omop_concept_name", "label"] # List of strings are columns to be collated
        itemid: "itemid (omop_source_code)"
        parent_codes: "{omop_vocabulary_id}/{omop_concept_code}"
        valueuom: "valueuom"

