  admission:
    code:
      - ADMISSION-AT-HOSPITAL
      - hosp/admissions
    time: col(admittime)
    time_format: "%Y-%m-%d %H:%M:%S"
    admission_type: admission_type
    admission_location: admission_location
    hadm_id: hadm_id
  admit_type:
    code:
      - ADMISSION-TYPE
      - col(admission_type)
      - hosp/admissions
    time: col(admittime)
    time_format: "%Y-%m-%d %H:%M:%S"
    hadm_id: hadm_id
  admit_location:
    code:
      - ADMISSION-LOCATION
      - col(admission_location)
      - hosp/admissions
    time: col(admittime)
    time_format: "%Y-%m-%d %H:%M:%S"
    hadm_id: hadm_id
  race:
    code:
      - RACE
      - col(race)
      - hosp/admissions
    time: null
    race: race
  discharge:
    code:
      - DISCHARGE-FROM-HOSPITAL
      - hosp/admissions
    time: col(dischtime)
    time_format: "%Y-%m-%d %H:%M:%S"
    discharge_location: discharge_location
    hadm_id: hadm_id
  disch_location:
    code:
      - DISCHARGE-lOCATION
      - col(discharge_location)
      - hosp/admissions
    time: col(dischtime)
    time_format: "%Y-%m-%d %H:%M:%S"
    discharge_location: discharge_location
    hadm_id: hadm_id
  age_at_admission:
    code:
      - AGE_AT_ADMISSION
      - hosp/admissions
    time: col(admittime)
    time_format: "%Y-%m-%d %H:%M:%S"
    numeric_value: col(age_at_admission)
    hadm_id: hadm_id
    died_in_hosp: hospital_expire_flag

hosp/diagnoses_icd:
  diagnosis:
    code:
      - DIAGNOSIS-ICD
      - col(icd_version)
      - col(icd_code)
      - hosp/diagnoses_icd
    hadm_id: hadm_id
    time: col(hadm_discharge_time)
    time_format: "%Y-%m-%d %H:%M:%S"
    diag_version: icd_version
    diag_icd_code: icd_code
    diag_seq_num: seq_num
    _metadata:
      hosp/d_icd_diagnoses:
        description: "long_title"
        parent_codes: "ICD{icd_version}CM/{norm_icd_code}" # Single strings are templates of columns.

hosp/drgcodes:
